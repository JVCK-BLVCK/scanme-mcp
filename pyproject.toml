[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanme-mcp"
version = "0.1.0"
description = "A standalone Model Context Protocol server for Nuclei vulnerability scans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.30.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "prometheus-client>=0.20,<1",
]

[project.scripts]
scanme-mcp = "scanme_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
